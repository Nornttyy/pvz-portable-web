<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>植物大战僵尸 · 中文沙盒</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <main id="loader" aria-label="游戏加载">
    <div id="title-art" aria-hidden="true"></div>
    <section id="loading-panel">
      <p class="eyebrow">中文沙盒 · 非官方试玩</p>
      <h1>植物大战僵尸</h1>
      <p id="status" role="status" aria-live="polite">正在准备引擎…</p>
      <p id="connection-status" role="status" hidden>网络已断开，重新联网后可重试。</p>
      <progress id="progress" max="100" value="0" aria-label="加载进度"></progress>
      <button id="start" disabled>正在加载</button>
      <button id="reload" hidden>重新加载</button>
      <nav id="entry-actions" aria-label="启动页工具">
        <button id="share-site" type="button">分享网址</button>
      </nav>
      <input id="share-link" aria-label="游戏网址，长按复制" readonly hidden>
      <p id="share-status" role="status" hidden></p>
      <details id="start-help">
        <summary>第一次玩？</summary>
        <p>游戏会自动加载，完成后点「开始游戏」。首次需下载约 51 MB，之后优先使用缓存。</p>
        <p>手机建议横屏。微信内打不开时，可在系统浏览器中打开。</p>
      </details>
      <p id="loader-note">游戏自动加载，存档保存在此浏览器。<br><a href="credits.html">来源与许可</a></p>
      <details id="diagnostics" hidden><summary>查看错误详情</summary><pre id="error-detail"></pre></details>
      <noscript>请启用浏览器 JavaScript 后重新打开。</noscript>
    </section>
  </main>
  <div id="canvas-container" hidden>
    <p id="orientation-hint">横屏可获得更大的游戏画面</p>
    <canvas id="canvas" width="800" height="600" tabindex="0" aria-label="植物大战僵尸游戏画面"></canvas>
  </div>
  <details id="tools" hidden>
    <summary aria-label="本地工具">工具</summary>
    <div id="tool-panel">
      <button id="fullscreen">全屏</button>
      <button id="export-save">备份存档</button>
      <button id="import-save">恢复存档</button>
      <button id="return">返回启动页</button>
      <small id="save-status" role="status">存档保存在此浏览器</small>
    </div>
  </details>
  <input id="save-file" type="file" accept=".zip,application/zip" hidden>
  <input id="layout-file" type="file" accept=".json,application/json" hidden>
  <textarea id="pvz-soft-keyboard" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="游戏文字输入"></textarea>
  <script src="bootstrap.js"></script>
  <script src="vendor/jszip-3.10.1.min.js"></script>
  <script async src="sandbox-engine/pvz-portable.js"></script>
  <script type="module" src="runtime.mjs"></script>
  <script type="module" src="sandbox.mjs"></script>
</body>
</html>
